<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#2c6e49">
  <meta name="description" content="今天练了吗 - 每一次，都算数 · 本地优先的训练管理应用">
  <title>今天练了吗</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- iOS PWA：全屏、状态栏样式、应用名 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今天练了吗">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">今天练了吗</div>
          <div class="brand-slogan">每一次，都算数</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="plans">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
          <span>计划</span>
        </button>
        <button class="nav-item" data-page="records">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14"/><path d="M8 7h8M8 11h8M8 15h5"/><path d="M4 19h16"/></svg></span>
          <span>记录</span>
        </button>
        <button class="nav-item" data-page="stats">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M21 6v5h-5"/></svg></span>
          <span>进步</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          <span>我的</span>
        </button>
      </nav>
      <div class="sidebar-foot"><span class="dot"></span><span>本地存储 · 每一次都算数</span></div>
    </aside>

    <main class="main">
      <div class="scroller" id="scroller">
        <header class="page-header">
          <div class="header-copy">
            <div class="kicker" id="pageKicker">YOUR PERSONAL FITNESS SPACE</div>
            <h1 id="pageTitle">把训练，变成日常。</h1>
            <p id="pageSubtitle">照自己的节奏，一点点向前。</p>
          </div>
          <div class="header-action" id="headerAction"></div>
        </header>
        <div class="content" id="content"></div>
      </div>
    </main>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
